<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>T BOT</title>
<style>
  /* spec §24: dark / grafite / preto / dourado / âmbar — compact, dense, desktop-first */
  :root{--bg:#0c0c10;--panel:#16161c;--line:#26262e;--gold:#c9a227;--amber:#ffb347;--txt:#d8d8de;--dim:#8a8a95;--ok:#3fbf60;--warn:#e0a832;--err:#e05252}
  *{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",Roboto,sans-serif;font-size:12px}
  body{background:var(--bg);color:var(--txt);overflow:hidden}
  #app{display:grid;grid-template-columns:170px 1fr;grid-template-rows:40px 1fr 92px;height:100vh}
  header{grid-column:1/3;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
  header h1{color:var(--gold);font-size:15px;letter-spacing:2px}
  .pill{padding:2px 10px;border-radius:10px;border:1px solid var(--line);color:var(--dim)}
  .pill.on{color:var(--ok);border-color:var(--ok)}
  nav{background:var(--panel);border-right:1px solid var(--line);padding-top:8px}
  nav button{display:block;width:100%;text-align:left;padding:9px 14px;background:none;border:0;color:var(--dim);cursor:pointer}
  nav button.active{color:var(--gold);border-left:2px solid var(--gold);background:#1c1c24}
  main{padding:12px;overflow:auto}
  footer{grid-column:1/3;border-top:1px solid var(--line);background:var(--panel);padding:8px 14px;display:flex;gap:22px;align-items:center}
  .bar{width:140px;height:8px;background:#222;border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle}
  .bar i{display:block;height:100%}
  .hp i{background:var(--err)} .mp i{background:#4a7bd7} .cap i{background:var(--warn)}
  #btnToggle{margin-left:auto;padding:8px 26px;border-radius:4px;border:1px solid var(--gold);background:transparent;color:var(--gold);font-weight:700;letter-spacing:1px;cursor:pointer}
  #btnToggle.running{border-color:var(--err);color:var(--err)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:10px}
  canvas{background:#0a0a0e;border:1px solid var(--line);border-radius:6px;width:100%}
  pre{white-space:pre-wrap;font-family:Consolas,monospace;font-size:11px;line-height:1.5}
  table{width:100%;border-collapse:collapse} td,th{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left;color:var(--dim)}
  th{color:var(--gold)}
  .log-INFO{color:var(--dim)} .log-WARNING{color:var(--warn)} .log-ERROR{color:var(--err)}
</style>
</head>
<body>
<div id="app">
  <header><h1>T BOT</h1><span id="conn" class="pill">OFFLINE</span></header>
  <nav id="nav"></nav>
  <main id="view"></main>
  <footer>
    <span>HP <span class="bar hp"><i id="bHp"></i></span> <b id="tHp">–</b></span>
    <span>MP <span class="bar mp"><i id="bMp"></i></span> <b id="tMp">–</b></span>
    <span>CAP <span class="bar cap"><i id="bCap"></i></span> <b id="tCap">–</b></span>
    <span>XP/H <b id="tXph">–</b></span>
    <span>Loot <b id="tLoot">–</b></span>
    <span>Kills <b id="tKills">–</b></span>
    <button id="btnToggle">▶ ATIVAR BOT</button>
  </footer>
</div>
<script src="ui/app.js"></script>
</body>
</html>
